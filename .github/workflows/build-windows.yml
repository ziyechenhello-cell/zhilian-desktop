name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --target x86_64-pc-windows-msvc
          tagName: v__VERSION__
          releaseName: "智恋bot v__VERSION__"
          releaseBody: "Windows 安装包（x64）。下载后双击安装，覆盖升级即可。未签名，首次运行如提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」。"
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: zhilian-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error